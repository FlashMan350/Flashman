<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashMan</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:white;
  padding-bottom:120px;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:240px;
  height:100vh;
  background:#050505;
  padding:28px 20px;
  border-right:1px solid #202020;
}

.logo{
  font-size:30px;
  font-weight:bold;
  margin-bottom:40px;
}

.logo span{
  color:#1ed760;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.nav button{
  background:none;
  border:0;
  color:#aaa;
  text-align:left;
  padding:14px;
  font-size:16px;
  border-radius:10px;
  cursor:pointer;
}

.nav button:hover{
  background:#181818;
  color:white;
}

.main{
  margin-left:240px;
  padding:30px;
}

.hero{
  background:linear-gradient(135deg,#1b1b1b,#0b0b0b);
  border-radius:20px;
  padding:45px 35px;
  margin-bottom:30px;
}

.hero small{
  color:#1ed760;
  font-weight:bold;
}

.hero h1{
  font-size:52px;
  margin:10px 0;
}

.hero p{
  color:#aaa;
  font-size:17px;
}

.search{
  width:100%;
  max-width:600px;
  padding:16px 20px;
  border-radius:30px;
  border:1px solid #333;
  background:#151515;
  color:white;
  font-size:16px;
  outline:none;
  margin-bottom:30px;
}

.search:focus{
  border-color:#1ed760;
}

.section-title{
  font-size:25px;
  margin-bottom:20px;
}

.songs{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
}

.song{
  background:#151515;
  padding:15px;
  border-radius:15px;
  transition:.2s;
}

.song:hover{
  background:#202020;
  transform:translateY(-3px);
}

.cover{
  height:160px;
  border-radius:12px;
  background:linear-gradient(135deg,#1ed760,#0b5);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
  margin-bottom:15px;
}

.song h3{
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song p{
  color:#888;
  font-size:13px;
  margin:7px 0 12px;
}

.play-song{
  width:100%;
  border:0;
  background:#1ed760;
  color:black;
  padding:10px;
  border-radius:20px;
  font-weight:bold;
  cursor:pointer;
}

.play-song:hover{
  background:#25f06d;
}

.status{
  color:#888;
  margin-bottom:20px;
}

.player{
  position:fixed;
  left:240px;
  right:0;
  bottom:0;
  min-height:110px;
  background:#101010;
  border-top:1px solid #292929;
  display:grid;
  grid-template-columns:240px 1fr 180px;
  align-items:center;
  gap:25px;
  padding:15px 25px;
  z-index:100;
}

.now{
  min-width:0;
}

.now-title{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.now-artist{
  color:#888;
  font-size:13px;
  margin-top:5px;
}

.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
}

.controls button{
  background:none;
  border:0;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.controls .main-play{
  width:48px;
  height:48px;
  border-radius:50%;
  background:white;
  color:black;
  font-size:20px;
}

.progress{
  position:absolute;
  left:25px;
  right:25px;
  bottom:5px;
  height:22px;
  display:flex;
  align-items:center;
  gap:8px;
}

.time{
  color:#999;
  font-size:11px;
  width:35px;
}

.seek{
  position:relative;
  flex:1;
  height:18px;
  display:flex;
  align-items:center;
  cursor:pointer;
  touch-action:none;
}

.seek-track{
  width:100%;
  height:7px;
  background:#444;
  border-radius:10px;
  overflow:hidden;
}

.seek-fill{
  height:100%;
  width:0%;
  background:#1ed760;
}

.seek-thumb{
  position:absolute;
  width:18px;
  height:18px;
  border-radius:50%;
  background:white;
  left:0%;
  top:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 8px #000;
}

.volume{
  display:flex;
  align-items:center;
  gap:8px;
}

.volume input{
  width:100px;
}

.mobile-nav{
  display:none;
}

@media(max-width:800px){

  body{
    padding-bottom:190px;
  }

  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
    padding:18px;
    padding-bottom:30px;
  }

  .hero{
    padding:30px 22px;
  }

  .hero h1{
    font-size:38px;
  }

  .songs{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .cover{
    height:130px;
    font-size:42px;
  }

  .player{
    left:0;
    right:0;
    bottom:58px;
    min-height:125px;
    display:block;
    padding:12px 15px 38px;
  }

  .now{
    text-align:center;
    margin-bottom:8px;
  }

  .controls{
    gap:20px;
  }

  .controls button{
    font-size:19px;
  }

  .controls .main-play{
    width:45px;
    height:45px;
  }

  .volume{
    display:none;
  }

  .progress{
    left:12px;
    right:12px;
    bottom:7px;
    height:32px;
    gap:7px;
  }

  .seek{
    height:32px;
  }

  .seek-track{
    height:9px;
  }

  .seek-thumb{
    width:22px;
    height:22px;
  }

  .mobile-nav{
    position:fixed;
    display:flex;
    left:0;
    right:0;
    bottom:0;
    height:58px;
    background:#090909;
    border-top:1px solid #222;
    z-index:200;
    justify-content:space-around;
    align-items:center;
  }

  .mobile-nav button{
    background:none;
    border:0;
    color:#aaa;
    font-size:12px;
  }

  .mobile-nav button:first-child{
    color:#1ed760;
  }
}
</style>
</head>

<body>

<aside class="sidebar">
  <div class="logo">Flash<span>Man</span></div>

  <div class="nav">
    <button onclick="window.scrollTo({top:0,behavior:'smooth'})">⌂ Home</button>
    <button onclick="document.getElementById('search').focus()">🔎 Search</button>
    <button onclick="showLiked()">♥ Liked Songs</button>
  </div>
</aside>

<main class="main">

  <section class="hero">
    <small>WELCOME TO</small>
    <h1>FlashMan</h1>
    <p>Your music. Your world. Your sound.</p>
  </section>

  <input
    class="search"
    id="search"
    type="text"
    placeholder="Search songs or artists..."
    oninput="searchSongs()"
  >

  <div class="status" id="status"></div>

  <h2 class="section-title">Your Music</h2>

  <div class="songs" id="songs"></div>

</main>

<div class="player">

  <div class="now">
    <div class="now-title" id="nowTitle">Nothing playing</div>
    <div class="now-artist" id="nowArtist">FlashMan</div>
  </div>

  <div class="controls">
    <button onclick="previousSong()">⏮</button>
    <button onclick="toggleShuffle()">🔀</button>
    <button class="main-play" id="playButton" onclick="togglePlay()">▶</button>
    <button onclick="toggleRepeat()">🔁</button>
    <button onclick="nextSong()">⏭</button>
  </div>

  <div class="volume">
    🔊
    <input
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="1"
      oninput="audio.volume=this.value"
    >
  </div>

  <div class="progress">
    <span class="time" id="currentTime">0:00</span>

    <div class="seek" id="seek">
      <div class="seek-track">
        <div class="seek-fill" id="seekFill"></div>
      </div>
      <div class="seek-thumb" id="seekThumb"></div>
    </div>

    <span class="time" id="duration">0:00</span>
  </div>

</div>

<div class="mobile-nav">
  <button onclick="window.scrollTo({top:0,behavior:'smooth'})">⌂<br>Home</button>
  <button onclick="document.getElementById('search').focus()">🔎<br>Search</button>
  <button onclick="showLiked()">♥<br>Liked</button>
</div>

<audio id="audio"></audio>

<script>

const SUPABASE_URL="https://ytgqxnvzdwwchpvhklrm.supabase.co";
const SUPABASE_KEY="sb_publishable_KgJtg8muMkxYPTxy6XX0Gw_XF6hdafk";
const BUCKET="songs";

const audio=document.getElementById("audio");
const songsContainer=document.getElementById("songs");
const search=document.getElementById("search");
const status=document.getElementById("status");

const nowTitle=document.getElementById("nowTitle");
const nowArtist=document.getElementById("nowArtist");
const playButton=document.getElementById("playButton");

const currentTimeElement=document.getElementById("currentTime");
const durationElement=document.getElementById("duration");

const seek=document.getElementById("seek");
const seekFill=document.getElementById("seekFill");
const seekThumb=document.getElementById("seekThumb");

let songs=[];
let filteredSongs=[];
let currentIndex=-1;
let dragging=false;
let shuffle=false;
let repeat=false;

function formatTime(seconds){
  if(!isFinite(seconds)) return "0:00";

  let min=Math.floor(seconds/60);
  let sec=Math.floor(seconds%60);

  if(sec<10) sec="0"+sec;

  return min+":"+sec;
}

async function loadSongs(){

  status.innerText="Loading music...";

  try{

    const response=await fetch(
      SUPABASE_URL+"/storage/v1/object/list/"+BUCKET,
      {
        method:"POST",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          prefix:"",
          limit:1000,
          offset:0,
          sortBy:{
            column:"name",
            order:"asc"
          }
        })
      }
    );

    if(!response.ok){
      throw new Error("Could not load songs");
    }

    const files=await response.json();

    songs=files
      .filter(file=>file.name && file.name.toLowerCase().endsWith(".mp3"))
      .map(file=>{

        let filename=file.name.replace(/\.mp3$/i,"");

        let title=filename;
        let artist="FlashMan";

        if(filename.includes(" - ")){
          let parts=filename.split(" - ");
          artist=parts[0];
          title=parts.slice(1).join(" - ");
        }

        return {
          name:file.name,
          title:title,
          artist:artist,
          url:
            SUPABASE_URL+
            "/storage/v1/object/public/"+
            BUCKET+
            "/"+
            encodeURIComponent(file.name)
        };

      });

    filteredSongs=[...songs];

    status.innerText="";

    displaySongs();

  }catch(error){

    console.error(error);

    status.innerText="Unable to load music. Check your Supabase settings.";

  }

}

function displaySongs(){

  songsContainer.innerHTML="";

  if(filteredSongs.length===0){

    songsContainer.innerHTML=
      "<p style='color:#888'>No songs found.</p>";

    return;

  }

  filteredSongs.forEach(song=>{

    const realIndex=songs.indexOf(song);

    const card=document.createElement("div");
    card.className="song";

    card.innerHTML=`

      <div class="cover">♫</div>

      <h3>${escapeHTML(song.title)}</h3>

      <p>${escapeHTML(song.artist)}</p>

      <button class="play-song">
        ▶ Play
      </button>

    `;

    card.querySelector(".play-song")
      .onclick=()=>playSong(realIndex);

    songsContainer.appendChild(card);

  });

}

function escapeHTML(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function searchSongs(){

  const query=search.value.toLowerCase().trim();

  filteredSongs=songs.filter(song=>
    song.title.toLowerCase().includes(query) ||
    song.artist.toLowerCase().includes(query)
  );

  displaySongs();

}

function playSong(index){

  if(index<0 || index>=songs.length) return;

  currentIndex=index;

  const song=songs[index];

  audio.src=song.url;

  nowTitle.innerText=song.title;
  nowArtist.innerText=song.artist;

  audio.play();

  playButton.innerText="❚❚";

  updateSeekBar(0);

}

function togglePlay(){

  if(!audio.src){

    if(songs.length>0){
      playSong(0);
    }

    return;

  }

  if(audio.paused){

    audio.play();
    playButton.innerText="❚❚";

  }else{

    audio.pause();
    playButton.innerText="▶";

  }

}

function nextSong(){

  if(songs.length===0) return;

  let next;

  if(shuffle){

    next=Math.floor(Math.random()*songs.length);

  }else{

    next=currentIndex+1;

    if(next>=songs.length) next=0;

  }

  playSong(next);

}

function previousSong(){

  if(songs.length===0) return;

  if(audio.currentTime>3){

    audio.currentTime=0;
    return;

  }

  let previous=currentIndex-1;

  if(previous<0) previous=songs.length-1;

  playSong(previous);

}

function toggleShuffle(){

  shuffle=!shuffle;

}

function toggleRepeat(){

  repeat=!repeat;

}

audio.addEventListener("ended",()=>{

  if(repeat){

    audio.currentTime=0;
    audio.play();

  }else{

    nextSong();

  }

});

audio.addEventListener("play",()=>{

  playButton.innerText="❚❚";

});

audio.addEventListener("pause",()=>{

  playButton.innerText="▶";

});

audio.addEventListener("loadedmetadata",()=>{

  durationElement.innerText=formatTime(audio.duration);

});

audio.addEventListener("timeupdate",()=>{

  currentTimeElement.innerText=formatTime(audio.currentTime);

  if(audio.duration && !dragging){

    const percent=
      (audio.currentTime/audio.duration)*100;

    updateSeekBar(percent);

  }

});

function updateSeekBar(percent){

  if(percent<0) percent=0;
  if(percent>100) percent=100;

  seekFill.style.width=percent+"%";
  seekThumb.style.left=percent+"%";

}

function seekFromPointer(event){

  const rect=seek.getBoundingClientRect();

  let x=event.clientX-rect.left;

  if(x<0) x=0;
  if(x>rect.width) x=rect.width;

  const percent=(x/rect.width)*100;

  updateSeekBar(percent);

  if(audio.duration){

    audio.currentTime=
      (percent/100)*audio.duration;

  }

}

seek.addEventListener("pointerdown",event=>{

  if(!audio.duration) return;

  dragging=true;

  try{
    seek.setPointerCapture(event.pointerId);
  }catch(e){}

  seekFromPointer(event);

  event.preventDefault();

});

seek.addEventListener("pointermove",event=>{

  if(!dragging) return;

  seekFromPointer(event);

  event.preventDefault();

});

seek.addEventListener("pointerup",event=>{

  dragging=false;

  try{
    seek.releasePointerCapture(event.pointerId);
  }catch(e){}

});

seek.addEventListener("pointercancel",()=>{

  dragging=false;

});

function showLiked(){

  alert("Liked songs will appear here.");

}

loadSongs();

</script>

</body>
</html>
