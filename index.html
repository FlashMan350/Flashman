<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashMan Music</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#080808;
    color:white;
    min-height:100vh;
    padding-bottom:100px;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:230px;
    background:#111;
    padding:25px 15px;
    border-right:1px solid #222;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#1ed760;
    margin-bottom:35px;
    padding-left:10px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.menu button{
    background:none;
    border:0;
    color:#aaa;
    padding:14px;
    text-align:left;
    font-size:15px;
    border-radius:8px;
    cursor:pointer;
}

.menu button:hover{
    background:#222;
    color:white;
}

.main{
    margin-left:230px;
    padding:20px 30px;
}

.topbar{
    display:flex;
    gap:15px;
    align-items:center;
    margin-bottom:25px;
}

.search{
    flex:1;
    background:#181818;
    border:1px solid #333;
    border-radius:25px;
    padding:13px 20px;
    color:white;
    outline:none;
}

.refresh{
    background:#1ed760;
    border:0;
    border-radius:25px;
    padding:13px 22px;
    cursor:pointer;
    font-weight:bold;
}

.hero{
    background:linear-gradient(135deg,#12351f,#101010);
    border-radius:20px;
    padding:45px 35px;
    margin-bottom:25px;
}

.hero h1{
    font-size:45px;
    margin-bottom:10px;
}

.hero p{
    color:#aaa;
}

.status{
    color:#aaa;
    margin:15px 0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:18px;
}

.song{
    background:#151515;
    border-radius:15px;
    padding:15px;
    cursor:pointer;
    transition:.2s;
}

.song:hover{
    background:#222;
    transform:translateY(-3px);
}

.cover{
    width:100%;
    aspect-ratio:1;
    border-radius:10px;
    background:linear-gradient(135deg,#1ed760,#063d1c);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
    margin-bottom:13px;
}

.song h3{
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song p{
    color:#888;
    font-size:13px;
    margin-top:6px;
}

.player{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:90px;
    background:#111;
    border-top:1px solid #333;
    display:flex;
    align-items:center;
    gap:20px;
    padding:12px 25px;
    z-index:10;
}

.now{
    width:220px;
    overflow:hidden;
}

.now h3{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.now p{
    color:#888;
    font-size:12px;
    margin-top:4px;
}

.controls{
    display:flex;
    align-items:center;
    gap:10px;
}

.controls button{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#222;
    color:white;
    cursor:pointer;
    font-size:17px;
}

.controls button:hover{
    background:#333;
}

.play{
    background:#1ed760 !important;
    color:black !important;
}

.progress{
    flex:1;
}

.progress input{
    width:100%;
    accent-color:#1ed760;
}

.volume{
    width:100px;
}

.volume input{
    width:100%;
    accent-color:#1ed760;
}

.empty{
    color:#777;
    padding:40px;
    text-align:center;
}

@media(max-width:700px){
    .sidebar{
        display:none;
    }

    .main{
        margin-left:0;
        padding:15px;
    }

    .hero h1{
        font-size:32px;
    }

    .topbar{
        flex-direction:column;
    }

    .search{
        width:100%;
    }

    .refresh{
        width:100%;
    }

    .player{
        height:105px;
        padding:10px;
        gap:10px;
        flex-wrap:wrap;
    }

    .now{
        width:130px;
    }

    .progress{
        order:3;
        width:100%;
        flex-basis:100%;
    }

    .volume{
        display:none;
    }
}
</style>
</head>

<body>

<aside class="sidebar">
    <div class="logo">♫ FlashMan</div>

    <div class="menu">
        <button onclick="showHome()">🏠 Home</button>
        <button onclick="showLiked()">❤️ Liked Songs</button>
        <button onclick="showQueue()">📋 Queue</button>
        <button onclick="loadSongs()">🔄 Refresh Music</button>
    </div>
</aside>

<main class="main">

    <div class="topbar">
        <input
            class="search"
            id="search"
            placeholder="Search songs or artists..."
            oninput="displaySongs()"
        >

        <button class="refresh" onclick="loadSongs()">
            🔄 Refresh
        </button>
    </div>

    <section class="hero">
        <h1>FlashMan</h1>
        <p>Your online music player</p>
    </section>

    <div class="status" id="status">
        Loading music...
    </div>

    <div class="grid" id="songs"></div>

</main>

<div class="player">

    <div class="now">
        <h3 id="nowTitle">Nothing playing</h3>
        <p id="nowArtist">FlashMan</p>
    </div>

    <div class="controls">
        <button onclick="previousSong()">⏮</button>
        <button class="play" id="playButton" onclick="togglePlay()">▶</button>
        <button onclick="nextSong()">⏭</button>
        <button onclick="toggleShuffle()">🔀</button>
        <button onclick="toggleRepeat()">🔁</button>
    </div>

    <div class="progress">
        <input
            type="range"
            id="progress"
            min="0"
            max="100"
            value="0"
            oninput="seekSong()"
        >
    </div>

    <div class="volume">
        🔊
        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="1"
            oninput="changeVolume()"
        >
    </div>

</div>

<audio id="audio"></audio>

<script>

const SUPABASE_URL = "https://ytgqxnvzdwwchpvhklrm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KgJtg8muMkxYPTxy6XX0Gw_XF6hdafk";

const BUCKET = "songs";

let songs = [];
let currentIndex = -1;
let shuffle = false;
let repeat = false;
let queue = [];
let liked = JSON.parse(localStorage.getItem("flashmanLiked") || "[]");

const audio = document.getElementById("audio");

async function loadSongs(){

    document.getElementById("status").innerText =
        "Loading music from FlashMan...";

    try{

        const response = await fetch(
            SUPABASE_URL +
            "/storage/v1/object/list/" +
            BUCKET,
            {
                method:"POST",
                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":"Bearer " + SUPABASE_KEY,
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    prefix:"",
                    limit:1000,
                    offset:0,
                    sortBy:{
                        column:"name",
                        order:"asc"
                    }
                })
            }
        );

        if(!response.ok){
            throw new Error("Could not connect to Supabase");
        }

        const files = await response.json();

        songs = files
            .filter(file => file.name && file.name.toLowerCase().endsWith(".mp3"))
            .map(file => {

                let path = file.name;

                let title = path
                    .split("/")
                    .pop()
                    .replace(".mp3","");

                let artist = "FlashMan";

                if(title.includes(" - ")){

                    const parts = title.split(" - ");

                    title = parts[0].trim();
                    artist = parts.slice(1).join(" - ").trim();
                }

                const url =
                    SUPABASE_URL +
                    "/storage/v1/object/public/" +
                    BUCKET +
                    "/" +
                    path.split("/").map(encodeURIComponent).join("/");

                return {
                    title:title,
                    artist:artist,
                    file:url,
                    path:path
                };

            });

        displaySongs();

        document.getElementById("status").innerText =
            songs.length +
            " songs available online";

    }catch(error){

        console.error(error);

        document.getElementById("status").innerText =
            "Could not load songs. Check Supabase connection.";

    }
}

function displaySongs(){

    const container = document.getElementById("songs");

    const search =
        document.getElementById("search").value.toLowerCase();

    container.innerHTML="";

    const filtered = songs.filter(song =>
        song.title.toLowerCase().includes(search) ||
        song.artist.toLowerCase().includes(search)
    );

    if(filtered.length === 0){

        container.innerHTML =
            '<div class="empty">No songs found</div>';

        return;
    }

    filtered.forEach(song => {

        const index = songs.indexOf(song);

        const div = document.createElement("div");

        div.className="song";

        const isLiked = liked.includes(song.path);

        div.innerHTML = `
            <div class="cover">♫</div>

            <h3>${escapeHTML(song.title)}</h3>

            <p>${escapeHTML(song.artist)}</p>

            <p>${isLiked ? "❤️ Liked" : "🎵 Song"}</p>
        `;

        div.onclick = () => playSong(index);

        container.appendChild(div);

    });
}

function escapeHTML(text){

    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function playSong(index){

    if(!songs[index]) return;

    currentIndex=index;

    audio.src=songs[index].file;

    audio.play();

    document.getElementById("nowTitle").innerText =
        songs[index].title;

    document.getElementById("nowArtist").innerText =
        songs[index].artist;

    document.getElementById("playButton").innerText="⏸";

}

function togglePlay(){

    if(!audio.src){

        if(songs.length > 0){

            playSong(0);

        }

        return;
    }

    if(audio.paused){

        audio.play();

        document.getElementById("playButton").innerText="⏸";

    }else{

        audio.pause();

        document.getElementById("playButton").innerText="▶";

    }
}

function nextSong(){

    if(songs.length===0) return;

    let next;

    if(shuffle){

        next=Math.floor(Math.random()*songs.length);

    }else{

        next=currentIndex+1;

        if(next>=songs.length){

            next=0;

        }
    }

    playSong(next);
}

function previousSong(){

    if(songs.length===0) return;

    let previous=currentIndex-1;

    if(previous<0){

        previous=songs.length-1;

    }

    playSong(previous);
}

function toggleShuffle(){

    shuffle=!shuffle;

    alert(
        shuffle ?
        "Shuffle ON" :
        "Shuffle OFF"
    );
}

function toggleRepeat(){

    repeat=!repeat;

    alert(
        repeat ?
        "Repeat ON" :
        "Repeat OFF"
    );
}

audio.addEventListener("ended",function(){

    if(repeat){

        audio.currentTime=0;
        audio.play();

    }else{

        nextSong();

    }

});

audio.addEventListener("timeupdate",function(){

    if(audio.duration){

        document.getElementById("progress").value =
            (audio.currentTime / audio.duration) * 100;

    }

});

function seekSong(){

    if(audio.duration){

        audio.currentTime =
            (document.getElementById("progress").value / 100)
            * audio.duration;

    }
}

function changeVolume(){

    audio.volume =
        document.getElementById("volume").value;

}

function showHome(){

    document.getElementById("search").value="";
    displaySongs();

}

function showLiked(){

    const container=document.getElementById("songs");

    container.innerHTML="";

    const likedSongs=songs.filter(song =>
        liked.includes(song.path)
    );

    if(likedSongs.length===0){

        container.innerHTML =
            '<div class="empty">No liked songs yet</div>';

        return;
    }

    likedSongs.forEach(song=>{

        const index=songs.indexOf(song);

        const div=document.createElement("div");

        div.className="song";

        div.innerHTML=`
            <div class="cover">❤️</div>
            <h3>${escapeHTML(song.title)}</h3>
            <p>${escapeHTML(song.artist)}</p>
        `;

        div.onclick=()=>playSong(index);

        container.appendChild(div);

    });

}

function showQueue(){

    const container=document.getElementById("songs");

    container.innerHTML="";

    if(queue.length===0){

        container.innerHTML =
            '<div class="empty">Queue is empty</div>';

        return;
    }

    queue.forEach(index=>{

        const song=songs[index];

        const div=document.createElement("div");

        div.className="song";

        div.innerHTML=`
            <div class="cover">📋</div>
            <h3>${escapeHTML(song.title)}</h3>
            <p>${escapeHTML(song.artist)}</p>
        `;

        div.onclick=()=>playSong(index);

        container.appendChild(div);

    });

}

document.addEventListener("dblclick",function(e){

    const songElement=e.target.closest(".song");

    if(!songElement) return;

});

loadSongs();

setInterval(loadSongs,60000);

</script>

</body>
</html>
